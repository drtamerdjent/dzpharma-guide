  Réplique exacte du logo d'en-tête de l'app : stéthoscope blanc (icône Lucide)
  sur carré arrondi bleu médical (#0ea5e9 = bg-primary).
  Affiché comme icône d'onglet du navigateur.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DzPharma Guide">
  <!-- Carré arrondi bleu médical (même badge que l'en-tête) -->
  <rect width="64" height="64" rx="16" fill="#0ea5e9"/>

  <!-- Stéthoscope Lucide, blanc, centré (24 → 36 unités, échelle 1.5) -->
  <g transform="translate(14 14) scale(1.5)"
     fill="none" stroke="#ffffff" stroke-width="2.5"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 2v2"/>
    <path d="M5 2v2"/>
    <path d="M5 3H4a2 2 0 0 0-2 2v4a6 6 0 0 0 12 0V5a2 2 0 0 0-2-2h-1"/>
    <path d="M8 15a6 6 0 0 0 12 0v-3"/>
    <circle cx="20" cy="10" r="2"/>
  </g>
</svg>
