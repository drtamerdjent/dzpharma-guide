<?xml version="1.0" encoding="utf-8"?>
<!--
  DzPharma Guide — favicon / logo
  Capsule pharmaceutique inclinée sur fond bleu médical (couleur de l'app).
  Remplace l'ancien logo générique. Affiché comme icône d'onglet du navigateur.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="DzPharma Guide">
  <defs>
    <linearGradient id="dzp-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Fond arrondi -->
  <rect width="64" height="64" rx="14" fill="url(#dzp-bg)"/>

  <!-- Capsule inclinée (moitié blanche = médicament, moitié claire = générique) -->
  <g transform="rotate(-45 32 32)">
    <rect x="15" y="23" width="34" height="18" rx="9" fill="#ffffff"/>
    <path d="M32 23 h8 a9 9 0 0 1 0 18 h-8 z" fill="#bae6fd"/>
    <line x1="32" y1="23" x2="32" y2="41" stroke="#0284c7" stroke-width="1.6" opacity="0.35"/>

    <!-- Reflet discret -->
    <rect x="37" y="26" width="2.4" height="12" rx="1.2" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- Croix de la pharmacie, droite (centre de la moitié blanche après rotation) -->
  <g transform="translate(26 38)">
    <rect x="-5" y="-1.7" width="10" height="3.4" rx="1.7" fill="#0369a1"/>
    <rect x="-1.7" y="-5" width="3.4" height="10" rx="1.7" fill="#0369a1"/>
  </g>
</svg>
